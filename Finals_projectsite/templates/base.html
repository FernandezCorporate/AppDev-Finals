{% load static %}
<!DOCTYPE html>
<html>
<head>
   <meta charset="UTF-8">
   <title>{% block title %} SITE Scheduler and Calculator {% endblock %}</title>
   <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, shrink-to-fit=no' name='viewport' />
   
   <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

   <style>
       .hover-effect:hover {
           background-color: #343a40 !important;
           color: #fff !important;
       }
       .list-group-item.active {
           background-color: #0d6efd !important;
           color: #fff !important;
       }
   </style>
</head>

<body>
    <div class="d-flex" id="wrapper">
        <div class="bg-dark text-white p-3" id="sidebar-wrapper" style="width: 250px; min-height: 100vh;">
            <div class="sidebar-heading fs-5 pb-3 mb-3 border-bottom border-secondary text-center fw-bold">
                SITE Scheduler
            </div>
            <div class="list-group list-group-flush">
                <a href="#" class="list-group-item list-group-item-action bg-dark text-white border-0 py-2.5 px-3 rounded hover-effect">
                    Semesters
                </a>
                <a href="#" class="list-group-item list-group-item-action bg-dark text-white border-0 py-2.5 px-3 rounded hover-effect">
                    Create Schedule
                </a>
                <a href="#" class="list-group-item list-group-item-action bg-dark text-white border-0 py-2.5 px-3 rounded hover-effect">
                    Grade Calculator
                </a>
                <a href="#" class="list-group-item list-group-item-action bg-dark text-white border-0 py-2.5 px-3 rounded hover-effect mt-5 text-danger">
                    Logout
                </a>
            </div>
        </div>

        <div id="page-content-wrapper" class="w-100 bg-light">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 py-3 shadow-sm">
                <span class="navbar-brand mb-0 h1 fw-semibold">
                    {% block page_header %} Welcome {% endblock %}
                </span>
            </nav>

            <div class="container-fluid p-4">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
